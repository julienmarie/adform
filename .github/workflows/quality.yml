name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build deterministic reader A
        run: |
          mkdir -p artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-buildid=' -o artifacts/adform-reader-a ./cmd/adform-reader

      - name: Build deterministic reader B
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-buildid=' -o artifacts/adform-reader-b ./cmd/adform-reader

      - name: Verify reproducibility and checksum
        run: |
          cmp artifacts/adform-reader-a artifacts/adform-reader-b
          test -z "$(go tool buildid artifacts/adform-reader-a)"
          sha256sum artifacts/adform-reader-a artifacts/adform-reader-b | tee artifacts/adform-reader-builds.sha256
          expected="$(cut -d ' ' -f1 checksums/adform-reader_linux_amd64.sha256)"
          actual="$(sha256sum artifacts/adform-reader-a | cut -d ' ' -f1)"
          test "$actual" = "$expected"

      - name: Upload checksum evidence
        uses: actions/upload-artifact@v4
        with:
          name: adform-reader-linux-amd64-checksums
          path: artifacts/adform-reader-builds.sha256
          if-no-files-found: error
          retention-days: 14
